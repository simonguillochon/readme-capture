name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm install -g @fission-ai/openspec@1.15.0
      - run: npm run openspec:validate

  contract:
    runs-on: ubuntu-latest
    concurrency:
      group: notion-test-base
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:contract
        env:
          NOTION_TEST_TOKEN: ${{ secrets.NOTION_TEST_TOKEN }}
          NOTION_TEST_DATABASE_ID: ${{ secrets.NOTION_TEST_DATABASE_ID }}

  release:
    needs: [checks, contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.version.outputs.published == 'false'
        run: |
          npm ci
          npm run zip
      - if: steps.version.outputs.published == 'false'
        run: >-
          npx web-ext sign --channel=unlisted
          --source-dir .output/firefox-mv3
          --upload-source-code ".output/readme-capture-$VERSION-sources.zip"
          --artifacts-dir web-ext-artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      - if: steps.version.outputs.published == 'false'
        run: |
          shopt -s nullglob
          xpis=(web-ext-artifacts/*.xpi)
          if [ "${#xpis[@]}" -ne 1 ]; then
            exit 1
          fi
          mv "${xpis[0]}" "readme-capture-$VERSION.xpi"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.version.outputs.published == 'false'
        run: gh release create "v$VERSION" "readme-capture-$VERSION.xpi" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
